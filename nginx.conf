server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 = DNS embebido de Docker. Sin esto, nginx resuelve
    # "backend-epsas"/"backend-hexagonal" UNA sola vez al arrancar y cachea
    # esa IP para siempre; si el contenedor destino se recrea (rebuild,
    # restart) y Docker le asigna otra IP, nginx sigue apuntando a la IP
    # vieja -> puede terminar hablándole a un contenedor completamente
    # distinto que reusó esa IP (por eso el 404 "Cannot POST" venía de otra
    # app). Usar variables en proxy_pass fuerza a nginx a resolver de nuevo
    # cada "valid=10s".
    resolver 127.0.0.11 valid=10s;

    # Proxy hacia backend-epsas (ERP principal)
    # OJO: con variables en proxy_pass, nginx NO hace el reemplazo de
    # prefijo automático (eso solo pasa con un destino estático). Por eso
    # el proxy_pass va SIN sufijo de ruta: nginx reenvía la URI original
    # completa tal cual llegó (/api/auth/login), que ya coincide con lo que
    # espera el backend (su globalPrefix también es "api").
    location /api/ {
        set $upstream_epsas backend-epsas:3000;
        proxy_pass http://$upstream_epsas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        # Sin esto, nginx nunca reenvía el handshake de upgrade a WebSocket
        # (queda en HTTP/1.0 sin cabecera Upgrade) — el navegador intenta
        # subir de polling a WS real (NotificacionesGateway en /api/socket.io),
        # el backend nunca responde 101 y la sesión de socket.io queda
        # inválida (siguiente poll con ese sid -> 400).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy hacia backend-practica-hexagonal
    location /api2/ {
        set $upstream_hexagonal backend-hexagonal:3001;
        proxy_pass http://$upstream_hexagonal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        # Mismo motivo que en /api/ — EncuestasRealtimeGateway vive en
        # /api2/socket.io y necesita el upgrade real para no quedar
        # atascado en el ciclo polling->falla->sid inválido (400).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # backend-encuestas se fusionó dentro de backend-practica-hexagonal —
    # ya no es un contenedor aparte, sus rutas ahora viven bajo /api2/.

    # Archivos subidos por backend-practica-hexagonal
    location /uploads/ {
        set $upstream_hexagonal_uploads backend-hexagonal:3001;
        proxy_pass http://$upstream_hexagonal_uploads;
    }

    # SPA fallback: cualquier ruta desconocida cae en index.html.
    # index.html referencia los JS/CSS por nombre con hash — si el propio
    # index.html queda cacheado en el navegador, un cliente puede seguir
    # ejecutando una versión vieja del frontend indefinidamente después de
    # cada despliegue nuevo. Sin Cache-Control explícito, Chrome puede
    # servirlo desde caché sin revalidar (fue justo lo que pasó: un cliente
    # en la red vio el bug de x-tenant ya arreglado en el bundle nuevo,
    # porque tenía el index.html viejo cacheado).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        expires 30d;
        access_log off;
    }
}
