name: CI

on:
  pull_request:
    branches: [master, Dev]
  push:
    branches: [master, Dev]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false

      - run: npm run build

      - run: npm audit --production --audit-level=high
