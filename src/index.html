<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>EPSAS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/img/logo.ico" />
    <link rel="preload" as="image" href="/img/logo.3png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#39A900" />
    <!-- iOS no lee el manifest para esto — Safari solo se instala vía
         "Compartir → Agregar a inicio" y necesita estas etiquetas propias
         para el ícono y la barra de estado en modo standalone. -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EPSAS" />
    <!-- Modo oscuro: se decide ANTES de que cargue Angular, para que la
         pantalla no parpadee en blanco al abrir. Misma lógica que
         ThemeService.esOscuro() (localStorage 'modo': claro/oscuro/sistema). -->
    <script>
      (function () {
        // /m es el chat móvil: su splash es el orbe de Atlas, no el logo (ver .atlas-splash).
        if (/^\/m(?:[/?#]|$)/.test(location.pathname)) document.documentElement.setAttribute('data-splash', 'atlas');
        try {
          var m = localStorage.getItem('modo');
          var oscuro = m === 'oscuro' || (m === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
          if (oscuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111312');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Se muestra antes de que Angular descargue y monte <app-root>. Es HTML
         estático para no dejar una pantalla vacía al abrir o recargar la app. -->
    <div id="app-splash" role="status" aria-live="polite" aria-label="Cargando EPSAS">
      <div class="app-splash__content">
        <div class="app-splash__mark">
          <img src="/img/logo.3png" alt="" />
        </div>
        <!-- Solo en /m (html[data-splash="atlas"]): el orbe de Atlas, hecho con CSS. Es el mismo
             dibujo que el respaldo de features/assistant/mascota (mantenerlos parecidos). -->
        <div class="atlas-splash" aria-hidden="true">
          <span class="a-antena"></span>
          <span class="a-cabeza"><span class="a-visor"><i></i><i></i><b></b></span></span>
          <span class="a-sombra"></span>
        </div>
        <div class="app-splash__loader" aria-hidden="true"></div>
        <span class="app-splash__label app-splash__label--normal">Preparando tu espacio</span>
        <span class="app-splash__label app-splash__label--atlas">Despertando a Atlas…</span>
      </div>
    </div>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #f7fafc;
        transition: opacity .32s ease, visibility .32s ease;
      }
      #app-splash::before {
        content: '';
        position: absolute;
        width: min(64vw, 680px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(28, 154, 138, .12), rgba(30, 58, 95, 0) 67%);
        transform: translateY(-8%);
      }
      .app-splash__content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .app-splash__mark {
        width: 124px;
        height: 124px;
        padding: 9px;
        display: grid;
        place-items: center;
        border: 1px solid #e4edf1;
        border-radius: 30px;
        background: rgba(255, 255, 255, .96);
        box-shadow: 0 18px 46px rgba(15, 23, 42, .12);
        animation: splash-mark 1.8s ease-in-out infinite;
      }
      .app-splash__mark img { width: 100%; height: 100%; object-fit: contain; }
      .app-splash__loader {
        width: 30px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #dce9e8;
      }
      .app-splash__loader::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #1c9a8a;
        animation: splash-loader 1s ease-in-out infinite;
      }
      .app-splash__label {
        color: #52636f;
        font: 600 12px/1.2 Sora, sans-serif;
        letter-spacing: .02em;
      }
      #app-splash.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
      /* Splash en modo oscuro — misma paleta que src/styles/dark-theme.css */
      html[data-theme="dark"] #app-splash { background: #111312; }
      html[data-theme="dark"] .app-splash__mark { background: #1a1c1b; border-color: #2f3331; box-shadow: 0 18px 46px rgba(0, 0, 0, .45); }
      html[data-theme="dark"] .app-splash__loader { background: #2f3331; }
      html[data-theme="dark"] .app-splash__label { color: #9ba19e; }
      /* ── Splash de /m: el orbe de Atlas ─────────────────────────────── */
      .atlas-splash, .app-splash__label--atlas { display: none; }
      html[data-splash="atlas"] .app-splash__mark, html[data-splash="atlas"] .app-splash__label--normal { display: none; }
      html[data-splash="atlas"] .atlas-splash { display: block; }
      html[data-splash="atlas"] .app-splash__label--atlas { display: inline; }
      html[data-splash="atlas"] #app-splash { background: radial-gradient(120% 70% at 50% 0%, #e0f5cc, #f3faee 58%, #f7fafc); }
      html[data-splash="atlas"][data-theme="dark"] #app-splash { background: radial-gradient(120% 70% at 50% 0%, #17361a, #111312 62%); }
      .atlas-splash { position: relative; width: 190px; height: 190px; margin-bottom: -4px; animation: atlas-entra .7s cubic-bezier(.2, .9, .25, 1.3) both; }
      .atlas-splash .a-cabeza { position: absolute; left: 17%; right: 17%; top: 20%; bottom: 24%; border-radius: 50%;
        background: radial-gradient(circle at 32% 26%, #fff 0, #f3f8ef 30%, #cfe6c0 64%, #92c46f 100%);
        box-shadow: inset -8px -12px 22px rgba(40, 100, 0, .32), 0 16px 24px -10px rgba(35, 90, 0, .5);
        animation: atlas-flota 2.6s ease-in-out infinite; }
      .atlas-splash .a-visor { position: absolute; left: 11%; right: 11%; top: 31%; height: 40%; border-radius: 50%;
        background: radial-gradient(circle at 38% 24%, #34463a 0, #0c1410 66%); box-shadow: inset 0 2px 6px rgba(255, 255, 255, .16); }
      .atlas-splash i { position: absolute; top: 24%; width: 11%; height: 40%; border-radius: 999px; background: #7cff3a;
        box-shadow: 0 0 10px #5cd600; animation: atlas-parpadeo 3s infinite; }
      .atlas-splash i:nth-of-type(1) { left: 28%; } .atlas-splash i:nth-of-type(2) { right: 28%; }
      .atlas-splash b { position: absolute; left: 40%; right: 40%; bottom: 14%; height: 14%; border-bottom: 3px solid #7cff3a; border-radius: 0 0 999px 999px; }
      .atlas-splash .a-antena { position: absolute; left: 49%; top: 8%; width: 2.4%; height: 16%; background: #e6efe0; animation: atlas-flota 2.6s ease-in-out infinite; }
      .atlas-splash .a-antena::after { content: ''; position: absolute; left: 50%; top: -34%; width: 360%; aspect-ratio: 1; border-radius: 50%;
        transform: translateX(-50%); background: radial-gradient(circle at 35% 30%, #f1ffe0, #5cd600 70%); box-shadow: 0 0 12px #5cd600; animation: atlas-bombilla 1.1s ease-in-out infinite; }
      .atlas-splash .a-sombra { position: absolute; left: 24%; right: 24%; bottom: 8%; height: 5%; border-radius: 50%; background: rgba(0, 0, 0, .28); filter: blur(4px);
        animation: atlas-sombra 2.6s ease-in-out infinite; }
      @keyframes atlas-entra { from { opacity: 0; transform: scale(.4) rotate(-90deg); } }
      @keyframes atlas-flota { 50% { transform: translateY(-4%); } }
      @keyframes atlas-sombra { 50% { transform: scaleX(.86); opacity: .7; } }
      @keyframes atlas-parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
      @keyframes atlas-bombilla { 50% { filter: brightness(1.4); } }
      @keyframes splash-mark { 50% { transform: translateY(-5px); } }
      @keyframes splash-loader { 0% { transform: translateX(-100%); } 100% { transform: translateX(230%); } }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__mark, .app-splash__loader::after { animation: none; }
        .atlas-splash, .atlas-splash *, .atlas-splash .a-antena::after { animation: none !important; }
      }
    </style>
  </body>
</html>
